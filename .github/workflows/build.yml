name: Build & Verify ARM64 APK

on:
  push:
    branches:
      - master
      - "arena/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/update GitHub Release v1.0.0 after verification"
        required: false
        type: boolean
        default: false
      inspect_only:
        description: "Run only the guest keybind facts inspection (no build/verify/publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-level-archive:
    name: Build Private GD 1.0 Level Archive (GD History)
    # TEMPORARILY DISABLED. GD History is behind Cloudflare, which refuses the hosted
    # runner ranges, so this job only burns its 90-minute budget. Everything downstream
    # keys off the produced files, so the two regular APK variants keep building,
    # verifying and publishing while this is off. Set the repository variable
    # ENABLE_GDPS_VARIANT=true to switch the private-server variant back on.
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.inspect_only != true) && !contains(github.event.head_commit.message, '[inspect keybinds]') && vars.ENABLE_GDPS_VARIANT == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cached GD History archive build inputs
        uses: actions/cache@v4
        with:
          path: |
            /tmp/gdhistory_cache
            third_party/levels_1_0.bin
          # Deliberately NOT keyed on the script hash: every level's JSON/GMD response is
          # cached so a run that hits its deadline resumes in the next one instead of
          # starting over. A fresh key per run keeps the most recent progress restorable
          # through `restore-keys`. Bump the `db1` token when the DB format changes.
          key: gdhistory-1.0-levels-db1-${{ github.run_id }}
          restore-keys: |
            gdhistory-1.0-levels-db1-

      - name: Restore cached original Geometry Dash 1.02 APK
        uses: actions/cache@v4
        with:
          path: /tmp/gd_cache
          key: gd-1.02-build4-orig-v1

      - name: Probe GD History network routes
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -uo pipefail
          python3 scripts/build_gdhistory_db.py --out third_party/levels_1_0.bin \
            --probe --probe-timeout 20 2>&1 | tee /tmp/gdhistory_probe.log || true
          # Surface the per-route results as annotations (job logs are unavailable while
          # the archive job is still running).
          grep '^PROBE ' /tmp/gdhistory_probe.log | while IFS= read -r line; do
            echo "::notice title=GDHistory route probe::${line//%/%%}"
          done || true

      - name: Assemble private offline GD 1.0 level archive (IDs 128..1941)
        run: |
          set -euo pipefail
          mkdir -p third_party
          if [ -f /tmp/gd_cache/orig.apk ]; then
            cp /tmp/gd_cache/orig.apk third_party/Geometry.Dash.ver.1.02.build.4.apk
          elif [ -f /tmp/gd_cache/Geometry.Dash.ver.1.02.build.4.apk ]; then
            cp /tmp/gd_cache/Geometry.Dash.ver.1.02.build.4.apk third_party/Geometry.Dash.ver.1.02.build.4.apk
          else
            echo "::warning title=GD History archive::original APK unavailable, skipping frame validation"
          fi

          # 1. Assemble the private offline Geometry Dash 1.0 level archive (IDs 128..1941)
          #    from GD History's earliest archived version of every preserved level.
          if ! (
            set -euo pipefail
            python3 scripts/build_gdhistory_db.py \
              --out third_party/levels_1_0.bin \
              --orig-apk third_party/Geometry.Dash.ver.1.02.build.4.apk \
              --cache-dir /tmp/gdhistory_cache \
              --workers 4 \
              --deadline-seconds 4200
          ) > /tmp/gdhistory.log 2>&1; then
            python3 - /tmp/gdhistory.log "GD History archive build failed" << 'PYEOF'
          import sys
          raw = open(sys.argv[1], errors="replace").read().splitlines()
          txt = "\n".join(raw[-80:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
              print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
            cat /tmp/gdhistory.log
            exit 1
          fi
          cat /tmp/gdhistory.log


      - name: Upload GD 1.0 level archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd102-levels-archive
          path: third_party/levels_1_0.bin
          if-no-files-found: error

  build-apk:
    name: Build Android 16 ARM64 APK
    runs-on: ubuntu-24.04
    needs: build-level-archive
    # A skipped level-archive job must not skip the regular APK build.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.inspect_only != true) && !contains(github.event.head_commit.message, '[inspect keybinds]') }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GD 1.0 level archive
        if: ${{ vars.ENABLE_GDPS_VARIANT == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: gd102-levels-archive
          path: third_party

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore cached original Geometry Dash 1.02 APK
        uses: actions/cache@v4
        with:
          path: /tmp/gd_cache
          key: gd-1.02-build4-orig-v1

      - name: Cache pinned third-party sources (Dynarmic, zlib, Apktool)
        uses: actions/cache@v4
        with:
          path: |
            third_party/dynarmic
            third_party/zlib
            third_party/apktool.jar
          key: gd102-thirdparty-v1-${{ hashFiles('patches/*.patch', 'scripts/fetch_deps.sh') }}

      - name: Install host build dependencies & Android API 36 SDK tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev ninja-build zlib1g-dev

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          if [ ! -f "$SDK/platforms/android-36/android.jar" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" >/dev/null || true
          fi
          if [ -z "$(ls -d "$SDK"/build-tools/3[5678]* 2>/dev/null || true)" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" "build-tools;36.0.0" >/dev/null || true
          fi

      - name: Restore cached Geometry Dash 1.1 APK
        uses: actions/cache@v4
        with:
          path: /tmp/gd_cache11
          key: gd-1.1-build5-orig-v1

      - name: Prepare original APK & build ARM64 Android 16 APK
        run: |
          set -euo pipefail
          mkdir -p third_party dist
          if [ -f /tmp/gd_cache11/orig11.apk ]; then
            cp /tmp/gd_cache11/orig11.apk third_party/Geometry.Dash.ver.1.1.build.5.apk
          else
            ./scripts/fetch_deps.sh --with-apk11 third_party/Geometry.Dash.ver.1.1.build.5.apk || true
            if [ -f third_party/Geometry.Dash.ver.1.1.build.5.apk ]; then
              mkdir -p /tmp/gd_cache11
              cp third_party/Geometry.Dash.ver.1.1.build.5.apk /tmp/gd_cache11/orig11.apk
              echo "::notice title=GD 1.1 source::$(stat -c%s third_party/Geometry.Dash.ver.1.1.build.5.apk) bytes sha256=$(sha256sum third_party/Geometry.Dash.ver.1.1.build.5.apk | cut -d' ' -f1)"
            fi
          fi
          if [ -f /tmp/gd_cache/orig.apk ]; then
            cp /tmp/gd_cache/orig.apk third_party/Geometry.Dash.ver.1.02.build.4.apk
          elif [ -f /tmp/gd_cache/Geometry.Dash.ver.1.02.build.4.apk ]; then
            cp /tmp/gd_cache/Geometry.Dash.ver.1.02.build.4.apk third_party/Geometry.Dash.ver.1.02.build.4.apk
          fi

          APK_NAME="gd-1.02-arm64-com.robtopx.geometryj102.apk"
          ORIG_PKG_APK="GeometryDash-1.02-arm64-android16.apk"
          GDPS_APK="gd-1.02-gdps-com.robtopx.geomgdps102.apk"
          GD11_APK="gd-1.1-arm64-com.robtopx.geometryj11.apk"

          if ! (
            set -euo pipefail
            GD102_PACKAGE_NAME="com.robtopx.geometryj102" \
            GD102_APP_NAME="gd 1.02 arm64" \
              ./scripts/build_apk.sh \
                third_party/Geometry.Dash.ver.1.02.build.4.apk \
                "dist/$APK_NAME"

            GD102_PACKAGE_NAME="com.robtopx.geometryjump" \
            GD102_APP_NAME="Geometry Dash" \
              ./scripts/build_apk.sh \
                third_party/Geometry.Dash.ver.1.02.build.4.apk \
                "dist/$ORIG_PKG_APK"

            if [ -f third_party/Geometry.Dash.ver.1.1.build.5.apk ]; then
              GD102_VERSION="1.1" \
              GD102_INPUT_APK="third_party/Geometry.Dash.ver.1.1.build.5.apk" \
              GD102_INPUT_SHA256="" \
              GD102_PACKAGE_NAME="com.robtopx.geometryj11" \
              GD102_APP_NAME="gd 1.1 arm64" \
                ./scripts/build_apk.sh \
                  third_party/Geometry.Dash.ver.1.1.build.5.apk \
                  "dist/$GD11_APK"
            else
              echo "GD 1.1 APK absent; skipping the com.robtopx.geometryj11 variant"
            fi

            if [ -f third_party/levels_1_0.bin ]; then
              GD102_PACKAGE_NAME="com.robtopx.geomgdps102" \
              GD102_APP_NAME="gd 1.02 gdps arm64" \
              GD102_LOCAL_GDPS=1 \
              GD102_GDPS_DB="third_party/levels_1_0.bin" \
                ./scripts/build_apk.sh \
                  third_party/Geometry.Dash.ver.1.02.build.4.apk \
                  "dist/$GDPS_APK"
            else
              echo "GD 1.0 level archive absent; skipping the com.robtopx.geomgdps102 variant"
            fi
          ) > /tmp/build_apk.log 2>&1; then
            python3 - /tmp/build_apk.log "build_apk.sh failed" << 'PYEOF'
          import re, sys
          raw = open(sys.argv[1], errors="replace").read().splitlines()
          lines = [l for l in raw if not re.match(r"^\[\d+/\d+\] Building C", l)]
          txt = "\n".join(lines[-80:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
              print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
            cat /tmp/build_apk.log
            exit 1
          fi
          cat /tmp/build_apk.log

          mkdir -p /tmp/gd_cache
          if [ ! -f /tmp/gd_cache/orig.apk ]; then
            cp third_party/Geometry.Dash.ver.1.02.build.4.apk /tmp/gd_cache/orig.apk
          fi

          (
            cd dist
            sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
            sha256sum "$ORIG_PKG_APK" > "${ORIG_PKG_APK}.sha256"
            if [ -f "$GDPS_APK" ]; then
              sha256sum "$GDPS_APK" > "${GDPS_APK}.sha256"
            fi
            if [ -f "$GD11_APK" ]; then
              sha256sum "$GD11_APK" > "${GD11_APK}.sha256"
            fi
          )
          APK_SUMMARY="$(cat "dist/${APK_NAME}.sha256") ($(stat -c%s "dist/$APK_NAME") bytes)"
          echo "::notice title=Built APK::$APK_SUMMARY"
          if [ -f "dist/${GDPS_APK}.sha256" ]; then
            GDPS_SUMMARY="$(cat "dist/${GDPS_APK}.sha256") ($(stat -c%s "dist/$GDPS_APK") bytes, level archive $(stat -c%s third_party/levels_1_0.bin) bytes)"
            echo "::notice title=Built GDPS APK::$GDPS_SUMMARY"
          fi

      - name: Report build log on failure
        if: failure()
        run: |
          set -uo pipefail
          LOG=/tmp/build_apk.log
          if [ ! -f "$LOG" ]; then
            echo "::error title=build log::no $LOG (the failure happened before build_apk.sh ran)"
            exit 0
          fi
          python3 - "$LOG" << 'PYEOF'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          interesting = [l for l in lines if ("ERROR" in l or "error:" in l or "RuntimeError" in l
                          or "FAIL" in l or "Traceback" in l or "WARNING" in l or "!" == l[:1])]
          body = "\n".join((interesting or lines)[-40:])[-3300:]
          txt = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=build_apk failure::{txt}")
          PYEOF

      - name: Upload built ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd102-arm64-apk
          path: |
            dist/gd-1.02-arm64-com.robtopx.geometryj102.apk
            dist/gd-1.02-arm64-com.robtopx.geometryj102.apk.sha256
            dist/GeometryDash-1.02-arm64-android16.apk
            dist/GeometryDash-1.02-arm64-android16.apk.sha256
            dist/gd-1.02-gdps-com.robtopx.geomgdps102.apk
            dist/gd-1.02-gdps-com.robtopx.geomgdps102.apk.sha256
            dist/gd-1.1-arm64-com.robtopx.geometryj11.apk
            dist/gd-1.1-arm64-com.robtopx.geometryj11.apk.sha256
          if-no-files-found: error

  verify-arm64-runtime:
    name: Verify Native ARM64 Execution & GLES2 Rendering
    runs-on: ubuntu-24.04-arm
    needs: build-apk
    # Explicit: an SKIPPED ancestor (the currently disabled level-archive job) would
    # otherwise silently skip this job even though build-apk succeeded.
    if: ${{ !cancelled() && !failure() && needs.build-apk.result == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (ARM64)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built ARM64 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: gd102-arm64-apk
          path: dist

      - name: Cache pinned third-party sources (ARM64)
        uses: actions/cache@v4
        with:
          path: |
            third_party/dynarmic
            third_party/zlib
            third_party/apktool.jar
          key: gd102-thirdparty-arm64-v1-${{ hashFiles('patches/*.patch', 'scripts/fetch_deps.sh') }}

      - name: Install ARM64 headless Mesa EGL/GLES2 & build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libboost-dev ninja-build cmake zlib1g-dev \
            libegl-dev libgles2-mesa-dev libgl1-mesa-dri libgbm-dev \
            gcc-arm-linux-gnueabi unzip

      - name: Build & run real ARM64 headless GLES2 + JVM verification suite
        run: |
          set -euo pipefail
          APK_FILE="dist/gd-1.02-arm64-com.robtopx.geometryj102.apk"
          GDPS_APK="dist/gd-1.02-gdps-com.robtopx.geomgdps102.apk"
          GD11_APK_FILE="dist/gd-1.1-arm64-com.robtopx.geometryj11.apk"
          if ! (
            set -euo pipefail
            ./scripts/fetch_deps.sh
            ./guest/build.sh /tmp/test_gnu_libguestrt.so
            rm -rf /tmp/apk_arm32 /tmp/gd102_verify_data /tmp/apk_gdps /tmp/gd102_verify_data_gdps /tmp/apk_arm32_11 /tmp/gd102_verify_data_11
            mkdir -p /tmp/apk_arm32 /tmp/gd102_verify_data /tmp/apk_gdps /tmp/gd102_verify_data_gdps /tmp/apk_arm32_11 /tmp/gd102_verify_data_11
            unzip -q -j "$APK_FILE" \
              "assets/arm32/libguestrt.so" "assets/arm32/libgame.so" \
              -d /tmp/apk_arm32
            if [ -f "$GDPS_APK" ]; then
              unzip -q -j "$GDPS_APK" "assets/gdps/levels_1_0.bin" -d /tmp/apk_gdps
              # Real ARM32 probe executed inside the Dynarmic guest (gethostbyname -> connect -> HTTP).
              arm-linux-gnueabi-gcc -marm -march=armv7-a -mfloat-abi=soft -O2 -shared -fPIC \
                -fno-stack-protector -fno-asynchronous-unwind-tables \
                -o /tmp/apk_gdps/libgdps_probe.so tests/guest_gdps_probe.c
            else
              echo "GDPS APK absent; skipping the private-server runtime checks"
            fi
            if [ -f "$GD11_APK_FILE" ]; then
              rm -rf /tmp/apk_arm32_11 && mkdir -p /tmp/apk_arm32_11
              unzip -q -j "$GD11_APK_FILE" "assets/arm32/libguestrt.so" "assets/arm32/libgame.so" -d /tmp/apk_arm32_11
            fi
            ./tests/build_java_stubs.sh /tmp/headless_stubs.jar
          ) > /tmp/verify_prep.log 2>&1; then
            python3 - /tmp/verify_prep.log "ARM64 prep failed" << 'PYEOF'
          import sys
          raw = open(sys.argv[1], errors="replace").read().splitlines()
          txt = "\n".join(raw[-80:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
              print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
            cat /tmp/verify_prep.log
            exit 1
          fi
          cat /tmp/verify_prep.log

          # Build Linux ARM64 host bridge + gd102_verify_runner
          if ! cmake -S host -B /tmp/build_verify -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DGD102_BUILD_VERIFY_RUNNER=ON > /tmp/verify_cmake.log 2>&1 || \
             ! cmake --build /tmp/build_verify --parallel >> /tmp/verify_cmake.log 2>&1; then
            python3 - /tmp/verify_cmake.log "ARM64 CMake failed" << 'PYEOF'
          import re, sys
          raw = open(sys.argv[1], errors="replace").read().splitlines()
          lines = [l for l in raw if not re.match(r"^\[\d+/\d+\] Building C", l)]
          txt = "\n".join(lines[-80:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
              print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
            cat /tmp/verify_cmake.log
            exit 1
          fi

          LIBJVM="$(find "$JAVA_HOME" -name libjvm.so | head -n 1)"

          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          if ! /tmp/build_verify/gd102_verify_runner \
              "$LIBJVM" \
              /tmp/headless_stubs.jar \
              /tmp/apk_arm32 \
              "$APK_FILE" \
              /tmp/gd102_verify_data > /tmp/verify_run.log 2>&1; then
            python3 - /tmp/verify_run.log "gd102_verify_runner failed" << 'PYEOF'
          import sys
          raw = open(sys.argv[1], errors="replace").read().splitlines()
          txt = "\n".join(raw[-90:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
              print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
            cat /tmp/verify_run.log
            exit 1
          fi

          cat /tmp/verify_run.log

          # Cold-restart persistence check: relaunch in a fresh OS process against the saved data_dir
          # and verify GManager loads & inflates the existing CCGameManager.dat / CCGameStore.dat!
          if ! /tmp/build_verify/gd102_verify_runner \
              "$LIBJVM" \
              /tmp/headless_stubs.jar \
              /tmp/apk_arm32 \
              "$APK_FILE" \
              /tmp/gd102_verify_data > /tmp/verify_run2.log 2>&1 || \
             grep -q "First time loading CCGameManager.dat" /tmp/verify_run2.log; then
            python3 - /tmp/verify_run2.log "Cold-restart save reload failed" << 'PYEOF'
          import sys
          raw = open(sys.argv[1], errors="replace").read().splitlines()
          txt = "\n".join(raw[-90:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
              print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
            cat /tmp/verify_run2.log
            exit 1
          fi
          echo "[VERIFY] Cold-restart save reload PASSED (existing CCGameManager.dat & CCGameStore.dat loaded cleanly)" >> /tmp/verify_run.log

          if [ -f "$GDPS_APK" ]; then
            # GDPS variant: boot the com.robtopx.geomgdps102 build, load the embedded 1.0 archive,
            # exercise the private server over real sockets AND from real ARM32 guest code
            # (gethostbyname www.boomlings.com -> connect -> HTTP POST), then re-run the full
            # rendering / audio / save suite on that same APK.
            if ! /tmp/build_verify/gd102_verify_runner \
                "$LIBJVM" \
                /tmp/headless_stubs.jar \
                /tmp/apk_arm32 \
                "$GDPS_APK" \
                /tmp/gd102_verify_data_gdps \
                /tmp/apk_gdps/levels_1_0.bin \
                /tmp/apk_gdps/libgdps_probe.so > /tmp/verify_gdps.log 2>&1; then
              python3 - /tmp/verify_gdps.log "GDPS ARM64 runtime verification failed" << 'PYEOF'
            import sys
            raw = open(sys.argv[1], errors="replace").read().splitlines()
            txt = "\n".join(raw[-90:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
            for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
                print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
              cat /tmp/verify_gdps.log
              exit 1
            fi

            cat /tmp/verify_gdps.log
            SUMMARY="$(grep -E '^\[VERIFY\]|^===|^\[guest-probe\]' /tmp/verify_run.log /tmp/verify_gdps.log | sed 's|^/tmp/||' | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))')"
          fi
          if [ -f "$GD11_APK_FILE" ]; then
            # GD 1.1 variant: boot the real 1.1 guest binary on ARM64 and re-run the full
            # rendering / audio / save / input suite against it.
            if ! /tmp/build_verify/gd102_verify_runner \
                "$LIBJVM" \
                /tmp/headless_stubs.jar \
                /tmp/apk_arm32_11 \
                "$GD11_APK_FILE" \
                /tmp/gd102_verify_data_11 \
                "" "" 229 > /tmp/verify_11.log 2>&1; then
              python3 - /tmp/verify_11.log "GD 1.1 ARM64 runtime verification failed" << 'PYEOF'
            import sys
            raw = open(sys.argv[1], errors="replace").read().splitlines()
            txt = "\n".join(raw[-90:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
            for idx, start in enumerate(range(max(0, len(txt) - 7200), len(txt), 3600)):
                print(f"::error title={sys.argv[2]} ({idx+1})::{txt[start:start+3600]}")
          PYEOF
              cat /tmp/verify_11.log
              exit 1
            fi
            cat /tmp/verify_11.log
          fi

          SUMMARY_LOGS="/tmp/verify_run.log"
          if [ -f /tmp/verify_gdps.log ]; then SUMMARY_LOGS="$SUMMARY_LOGS /tmp/verify_gdps.log"; fi
          if [ -f /tmp/verify_11.log ]; then SUMMARY_LOGS="$SUMMARY_LOGS /tmp/verify_11.log"; fi
          SUMMARY="$(grep -E '^\[VERIFY\]|^===|^\[guest-probe\]' $SUMMARY_LOGS | sed 's|^/tmp/||' | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))')"
          echo "::notice title=ARM64 Runtime Verification::$SUMMARY"

      - name: Report verification logs on failure
        if: failure()
        run: |
          set -uo pipefail
          python3 - << 'PYEOF'
          import pathlib
          for name in ("verify_prep", "verify_run", "verify_gdps", "verify_11"):
              path = pathlib.Path(f"/tmp/{name}.log")
              if not path.is_file():
                  print(f"::error title={name}::log missing (failed before this phase)")
                  continue
              lines = path.read_text(errors="replace").splitlines()
              tail = "\n".join(lines[-35:])[-3200:]
              txt = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name} tail::{txt}")
          PYEOF

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build-apk
      - verify-arm64-runtime
    if: >-
      !cancelled() && !failure() &&
      needs.build-apk.result == 'success' &&
      needs.verify-arm64-runtime.result == 'success' &&
      !contains(github.event.head_commit.message, '[skip publish]') &&
      (github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/arena/') ||
      startsWith(github.ref, 'refs/tags/v') ||
      inputs.publish_release == true)
    steps:
      - name: Download verified ARM64 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: gd102-arm64-apk
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/publish_release.log) 2>&1
          TAG="v1.1.2"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          APK_NAME="gd-1.02-arm64-com.robtopx.geometryj102.apk"
          ORIG_PKG_APK="GeometryDash-1.02-arm64-android16.apk"
          GDPS_APK="gd-1.02-gdps-com.robtopx.geomgdps102.apk"
          GD11_APK="gd-1.1-arm64-com.robtopx.geometryj11.apk"
          SHA_COINSTALL="$(cat "dist/${APK_NAME}.sha256")"
          SHA_ORIG="$(cat "dist/${ORIG_PKG_APK}.sha256")"
          SHA_GDPS=""
          SHA_11=""
          ASSETS=(
            "dist/${APK_NAME}" "dist/${APK_NAME}.sha256"
            "dist/${ORIG_PKG_APK}" "dist/${ORIG_PKG_APK}.sha256"
          )
          # The private-server variant is optional: include it only when it was built.
          if [ -f "dist/${GDPS_APK}" ]; then
            SHA_GDPS="$(cat "dist/${GDPS_APK}.sha256")"
            ASSETS+=("dist/${GDPS_APK}" "dist/${GDPS_APK}.sha256")
          fi
          if [ -f "dist/${GD11_APK}" ]; then
            SHA_11="$(cat "dist/${GD11_APK}.sha256")"
            ASSETS+=("dist/${GD11_APK}" "dist/${GD11_APK}.sha256")
          fi

          # Refresh earlier release tags in-place so any bookmarked links serve the fully fixed APKs.
          for OLD_TAG in v1.0.0 v1.0.1 v1.0.2 v1.0.3 v1.0.4 v1.1.0 v1.1.1; do
            if gh release view "$OLD_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "$OLD_TAG" \
                "dist/${APK_NAME}" \
                "dist/${APK_NAME}.sha256" \
                "dist/${ORIG_PKG_APK}" \
                "dist/${ORIG_PKG_APK}.sha256" \
                --clobber --repo "${GITHUB_REPOSITORY}"
            fi
          done

          NOTES=$(cat <<EOF
          ## gd 1.02 / gd 1.1 arm64 — v1.1.2 (PC editor keybinds + FPS counter fix)

          ### Changelog
          - **added: keybinds for pc for the editor** (shift to enable swipe, scrollwheel for zooming in and out, and other keybinds)
            - **Hold Shift** — swipe is active while Shift is held, exactly like the desktop client; release to restore the swipe button's state.
            - **Scroll wheel** — zoom in/out through the editor's own discrete zoom steps (mouse wheel up = zoom in).
            - **T** — toggle swipe (persistent, same as the on-screen swipe button).
            - **+ / -** (main row or numpad) — zoom in/out.
            - **Ctrl+Z** — undo; **Ctrl+Shift+Z** or **Ctrl+Y** — redo.
            - **Arrow keys** — pan the editor view (the viewport follows the arrow).
            - Implemented by wrapping the Android window callback and, between rendered frames on the GL thread, driving the guest binary's own \\`EditorUI\\` entry points (\\`zoomIn\\`/\\`zoomOut\\`, \\`toggleSwipe\\`, undo/redo, game-layer pan) — no screen-coordinate taps, no guest code patched. Keybinds only act while the running scene really is the level editor (identified through the guest's own vtables); in menus, during gameplay, and while a text input has focus, every key passes through untouched. Present in all three APKs.
          - **fixed: fps counter not showing up** — the v1.1.1 overlay could attach to the window before the window finished creating and silently disappear. The overlay now attaches itself from a self-healing 500 ms ticker once the window exists, re-attaches if it is ever removed or the activity is recreated, logs each attempt under the \\`gd102-fps\\` logcat tag, and warns distinctly if the frame-counting hook stops firing.

          ### APK Variants Included
          1. **\\`${GD11_APK}\\`** — **Geometry Dash 1.1** (\\`package="com.robtopx.geometryj11"\\`, app name **\\`gd 1.1 arm64\\`**). Co-installable; Time Machine, both mirror portals, 1.1 achievements and icons.
          2. **\\`${APK_NAME}\\`** — **GD 1.02, co-installable** (\\`package="com.robtopx.geometryj102"\\`, app name **\\`gd 1.02 arm64\\`**), official online servers.
          3. **\\`${ORIG_PKG_APK}\\`** — **GD 1.02, original package id** (\\`package="com.robtopx.geometryjump"\\`, app name **\\`Geometry Dash\\`**), official online servers.

          ### Carried over from v1.1.x
          - **GD 1.1 content**: Time Machine with its soundtrack, achievements and icon/colour unlocks, plus both mirror portals (blue and orange) in-game and in the editor, running the unmodified Geometry Dash 1.1 (build 5) \\`libgame.so\\` through the ARM64 bridge.
          - **FPS counter** (top-left, 1 decimal, small plain sans-serif, not Pusab) and the v1.1.1 runner/game optimizations (redundant GL binds elided, render thread at \\`THREAD_PRIORITY_DISPLAY\\`).
          - **Large-screen text layout fix** (\\`ModernTextLayout\\`), music-unpause position, SFX pitch/speed, Android 16 / 16 KB page hardening.

          ### Notes
          - The 1.9 PC UHD (4x) texture back-port is **not** included: those assets are PC-only and were not available to the build, and 1.02 already ships the 2x \\`-hd\\` set.
          - The private offline level server variant (\\`com.robtopx.geomgdps102\\`) remains disabled while the GD History archive job cannot get through Cloudflare.
          - The changelog's "changed:" list was left empty, so nothing beyond the added keybinds and the FPS counter fix was altered; guest binaries are byte-identical to v1.1.1 and the full headless verification suite (226/229 constructors, menu hash, SFX, unpause seek, saves, editor-keybind gate probes) passes.

          ### SHA-256 Checksums
          \\`\\`\\`text
          ${SHA_11}
          ${SHA_COINSTALL}
          ${SHA_ORIG}
          ${SHA_GDPS}
          \\`\\`\\`
          EOF
          )

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" \
              --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" \
              --title "gd 1.02 / 1.1 arm64 — v1.1.2 (PC editor keybinds + FPS counter fix)" \
              --notes "$NOTES" \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "gd 1.02 / 1.1 arm64 — v1.1.2 (PC editor keybinds + FPS counter fix)" \
              --notes "$NOTES" \
              --target "${GITHUB_SHA}" \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Report publish log on failure
        if: failure()
        run: |
          set -uo pipefail
          LOG=/tmp/publish_release.log
          if [ ! -f "$LOG" ]; then
            echo "::error title=publish log::no $LOG (the failure happened before the release step ran)"
            exit 0
          fi
          python3 - "$LOG" << 'PYEOF'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          tail = "\n".join(lines[-35:])[-3200:]
          txt = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=publish_release tail::{txt}")
          PYEOF

  # On-demand reverse-engineering pass (dispatch with inspect_only=true): downloads the original
  # GD 1.02 / 1.1 APKs, extracts the ARM32 guest libgame.so, and commits the symbol/disassembly
  # facts needed to wire the editor keybinds (scripts/inspect_guest_keybinds.sh).
  inspect-guest-keybinds:
    name: Inspect guest keybind facts
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.inspect_only == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect keybinds]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi

      - name: Fetch original APKs (1.02 and 1.1)
        run: |
          ./scripts/fetch_deps.sh --with-apk
          ./scripts/fetch_deps.sh --with-apk11

      - name: Dump keybind facts
        run: ./scripts/inspect_guest_keybinds.sh

      - name: Surface highlights
        run: |
          {
            echo "### guest keybind facts highlights"
            grep -E "^(### guest|so_size|export_count)" tools/analysis/guest_keybind_facts.txt || true
            grep -E "sharedDirector|getRunningScene|_ZTV16LevelEditorLayer|_ZTV8EditorUI|toggleSwipe|zoomIn|getChildren|objectAtIndex" \
              tools/analysis/guest_keybind_facts.txt | head -40 || true
          } | sed 's|^|::notice title=keybind facts::|' | head -50

      - name: Commit facts (skip CI)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/analysis/guest_keybind_facts.txt
          if git diff --cached --quiet; then
            echo "facts unchanged"
          else
            git commit -m "analysis: guest keybind symbols & disassembly [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "$GITHUB_REF_NAME"
          fi
