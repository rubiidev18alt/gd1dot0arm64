# SPDX-License-Identifier: MIT
#
# On-demand reverse-engineering pass: downloads the original GD 1.02 / 1.1 APKs, extracts the
# ARM32 guest libgame.so, and commits symbol/disassembly facts needed to wire the editor keybinds
# (scripts/inspect_guest_keybinds.sh). Manually triggered; not part of the release pipeline.
name: Inspect guest keybind facts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-keybinds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi

      - name: Fetch original APKs (1.02 and 1.1)
        run: |
          ./scripts/fetch_deps.sh --with-apk
          ./scripts/fetch_deps.sh --with-apk11

      - name: Dump keybind facts
        run: ./scripts/inspect_guest_keybinds.sh

      - name: Surface highlights
        run: |
          {
            echo "### guest keybind facts highlights"
            grep -E "^(### guest|so_size|export_count)" tools/analysis/guest_keybind_facts.txt
            grep -E "sharedDirector|getRunningScene|_ZTV16LevelEditorLayer|_ZTV8EditorUI|toggleSwipe|zoomIn|getChildren|objectAtIndex" \
              tools/analysis/guest_keybind_facts.txt | head -40 || true
          } | sed 's|^|::notice title=keybind facts::|' | head -50

      - name: Commit facts (skip CI)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/analysis/guest_keybind_facts.txt
          if git diff --cached --quiet; then
            echo "facts unchanged"
          else
            git commit -m "analysis: guest keybind symbols & disassembly [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "$GITHUB_REF_NAME"
          fi
