name: Inspect GD 1.02 APK
on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    name: Dump GD 1.02 asset & binary facts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Restore cached original Geometry Dash 1.02 APK
        uses: actions/cache@v4
        with:
          path: /tmp/gd_cache
          key: gd-1.02-build4-orig-v1

      - name: Fetch APK if the cache missed
        run: |
          set -euo pipefail
          mkdir -p /tmp/gd_cache
          if [ -f /tmp/gd_cache/orig.apk ]; then exit 0; fi
          if [ -f /tmp/gd_cache/Geometry.Dash.ver.1.02.build.4.apk ]; then
            cp /tmp/gd_cache/Geometry.Dash.ver.1.02.build.4.apk /tmp/gd_cache/orig.apk; exit 0
          fi
          for U in \
            "https://ia803202.us.archive.org/view_archive.php?archive=/22/items/every-geometry-dash-version/every%20geometry%20dash%20version.zip&file=Geometry.Dash.ver.1.02.build.4.apk" \
            "https://ia903202.us.archive.org/view_archive.php?archive=/22/items/every-geometry-dash-version/every%20geometry%20dash%20version.zip&file=Geometry.Dash.ver.1.02.build.4.apk" \
            "https://archive.org/download/every-geometry-dash-version/every%20geometry%20dash%20version.zip/Geometry.Dash.ver.1.02.build.4.apk"; do
            if curl -fsSL --max-time 300 -o /tmp/gd_cache/orig.apk "$U"; then break; fi
          done
          test -s /tmp/gd_cache/orig.apk

      - name: Dump APK facts
        run: |
          set -euo pipefail
          python3 scripts/dump_apk_facts.py /tmp/gd_cache/orig.apk --out tools/analysis/gd102_facts.txt
          head -40 tools/analysis/gd102_facts.txt

      - name: Fetch reference builds (1.1, 1.71, 1.9) and dump their facts
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -uo pipefail
          fetch_zip_member() {
            local MEMBER="$1" OUT="$2"
            for U in \
              "https://ia803202.us.archive.org/view_archive.php?archive=/22/items/every-geometry-dash-version/every%20geometry%20dash%20version.zip&file=${MEMBER}" \
              "https://archive.org/download/every-geometry-dash-version/every%20geometry%20dash%20version.zip/${MEMBER}"; do
              if curl -fsSL --max-time 600 -o "$OUT" "$U" && [ -s "$OUT" ]; then return 0; fi
            done
            return 1
          }
          declare -A V=(
            [1.1]="Geometry.Dash.ver.1.1.build.5.apk"
            [1.71]="Geometry.Dash.ver.1.71.build.18.apk"
            [1.9]="Geometry.Dash.ver.1.90.build.22.apk"
          )
          for KEY in 1.1 1.71 1.9; do
            APK="/tmp/gd_ref_${KEY}.apk"
            if fetch_zip_member "${V[$KEY]}" "$APK"; then
              echo "fetched $KEY ($(stat -c%s "$APK") bytes)"
              python3 scripts/dump_apk_facts.py "$APK" --out "tools/analysis/gd${KEY/./}_facts.txt" || true
            else
              echo "::warning title=GD archive::could not fetch ${V[$KEY]}"
            fi
          done
          ls -la tools/analysis

      - name: List versions available in the public GD archive
        continue-on-error: true
        run: |
          set -uo pipefail
          URL="https://archive.org/download/every-geometry-dash-version/every%20geometry%20dash%20version.zip"
          curl -fsSL -r -3145728 -o /tmp/zip_tail.bin "$URL" || { echo "range fetch failed"; exit 0; }
          python3 - <<'PY' > tools/analysis/archive_versions.txt
          import struct
          blob = open("/tmp/zip_tail.bin", "rb").read()
          idx = blob.rfind(b"PK\x05\x06")
          print("# versions inside every-geometry-dash-version.zip")
          if idx < 0:
              print("no end-of-central-directory record in tail")
              raise SystemExit(0)
          _sig, disk, cd_disk, n_disk, n_total, cd_size, cd_off, clen = struct.unpack_from("<IHHHHIIH", blob, idx)
          print(f"entries {n_total} central_dir_size {cd_size} central_dir_offset {cd_off} comment {clen}")
          pos = idx - cd_size
          found = 0
          while pos >= 0 and pos + 46 <= len(blob):
              if blob[pos:pos+4] != b"PK\x01\x02":
                  break
              (ver, cver, flags, method, mtime, mdate, crc, csize, usize, nlen, elen, clen2,
               dstart, iattr, eattr, lho) = struct.unpack_from("<HHHHHHIIIHHHHHII", blob, pos + 4)
              name = blob[pos+46:pos+46+nlen].decode("utf-8", "replace")
              print(f"{usize:>12} {name}")
              found += 1
              pos += 46 + nlen + elen + clen2
          print(f"# parsed {found} entries")
          PY
          cat tools/analysis/archive_versions.txt

      - name: Decode framework smali (for the text-layout port)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -uo pipefail
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq openjdk-17-jre-headless >/dev/null 2>&1 || true
          curl -fsSL --retry 2 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar || exit 0
          java -jar /tmp/apktool.jar d -f -q -o /tmp/decoded /tmp/gd_cache/orig.apk || exit 0
          mkdir -p tools/analysis/smali
          for F in Cocos2dxBitmap Cocos2dxRenderer Cocos2dxHelper; do
            SRC="$(find /tmp/decoded -name "$F.smali" -print -quit)"
            if [ -n "$SRC" ]; then cp "$SRC" tools/analysis/smali/; fi
          done
          ls -la tools/analysis/smali || true

      - name: Decode GD 1.1 structure (port groundwork)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -uo pipefail
          APK=/tmp/gd_ref_1.1.apk
          [ -s "$APK" ] || { echo "GD 1.1 APK missing"; exit 0; }
          mkdir -p tools/analysis/gd11
          java -jar /tmp/apktool.jar d -f -q -o /tmp/decoded11 "$APK" || exit 0
          cp /tmp/decoded11/AndroidManifest.xml tools/analysis/gd11/ 2>/dev/null || true
          cp /tmp/decoded11/apktool.yml tools/analysis/gd11/ 2>/dev/null || true
          {
            echo "# GD 1.1 smali class inventory"
            for D in /tmp/decoded11/smali*; do
              echo "## $(basename "$D")"
              find "$D" -name '*.smali' -printf '%P\n' | sort
            done
          } > tools/analysis/gd11_classes.txt
          for F in Cocos2dxBitmap Cocos2dxRenderer Cocos2dxHelper; do
            SRC="$(find /tmp/decoded11 -name "$F.smali" -print -quit)"
            [ -n "$SRC" ] && cp "$SRC" tools/analysis/gd11/
          done
          SRC="$(find /tmp/decoded11 -name 'p.smali' -path '*cocos2dx*' -print -quit)"
          [ -n "$SRC" ] && cp "$SRC" tools/analysis/gd11/Cocos2dxMusic_p.smali
          ls -la tools/analysis/gd11
          echo "smali classes: $(wc -l < tools/analysis/gd11_classes.txt)"

      - name: Commit facts
        run: |
          set -euo pipefail
          git config user.name "gd102-inspector"
          git config user.email "gd102-inspector@users.noreply.github.com"
          git add tools/analysis
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "chore(analysis): record GD 1.02 APK facts [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
